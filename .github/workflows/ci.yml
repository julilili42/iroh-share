name: CI and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - .gitignore
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - .gitignore
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: appimage
            linuxdeploy_arch: x86_64
            linuxdeploy_sha256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          - platform: ubuntu-22.04-arm
            bundles: appimage
            linuxdeploy_arch: aarch64
            linuxdeploy_sha256: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xdg-utils

      - name: Install linuxdeploy
        if: startsWith(matrix.platform, 'ubuntu-')
        env:
          LINUXDEPLOY_ARCH: ${{ matrix.linuxdeploy_arch }}
          LINUXDEPLOY_SHA256: ${{ matrix.linuxdeploy_sha256 }}
        run: |
          mkdir -p "$HOME/.cache/tauri"
          curl --fail --location --output "$HOME/.cache/tauri/linuxdeploy-$LINUXDEPLOY_ARCH.AppImage" "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$LINUXDEPLOY_ARCH.AppImage"
          echo "$LINUXDEPLOY_SHA256  $HOME/.cache/tauri/linuxdeploy-$LINUXDEPLOY_ARCH.AppImage" | sha256sum --check
          chmod +x "$HOME/.cache/tauri/linuxdeploy-$LINUXDEPLOY_ARCH.AppImage"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINUXDEPLOY_EXCLUDED_LIBRARIES: libwayland-client.so*
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          generateReleaseNotes: true
          args: --bundles ${{ matrix.bundles }}
          releaseAssetNamePattern: iroh-share-v[version]-[platform]-[arch][setup][ext]
