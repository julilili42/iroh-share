name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n1)

          if gh release view "v$version" >/dev/null 2>&1; then
            released_commit=$(git rev-list -n 1 "v$version")
            if [ "$released_commit" != "$(git rev-parse HEAD)" ]; then
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
              VERSION="$version" perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{VERSION}"/m' Cargo.toml
              cargo check
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="iroh-share-v${VERSION}-macos-arm64.tar.gz"
          tar -czf "$archive" -C target/release iroh-share

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="iroh-share-v${VERSION}-macos-arm64.tar.gz"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$archive" --clobber
          else
            gh release create "v$VERSION" "$archive" --verify-tag --generate-notes
          fi
