<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Iroh Share</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="header">
        <button id="back" class="icon-button back" type="button" aria-label="Back" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <span id="radar" class="radar" aria-hidden="true"><i></i></span>
        <div class="heading">
          <h1 id="title">Nearby</h1>
          <p id="subtitle">Starting…</p>
        </div>
        <div id="header-actions" class="header-actions">
          <button id="copy-ticket" class="quiet-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="11" height="13" rx="2" /><path d="M15 7V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h1" /></svg>
            <span>Copy ticket</span>
          </button>
          <button id="use-ticket" class="quiet-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4V7Z" /><path d="M15 9v2m0 2v2" /></svg>
            <span>Use ticket</span>
          </button>
        </div>
      </header>

      <section id="content" class="content" aria-live="polite"></section>
    </main>

    <dialog id="ticket-dialog" class="dialog">
      <form method="dialog">
        <h2>Send with ticket</h2>
        <p>Paste the ticket shown on the other device.</p>
        <label for="ticket-input">Connection ticket</label>
        <input id="ticket-input" type="text" autocomplete="off" spellcheck="false" placeholder="Paste ticket" />
        <span id="ticket-error" class="error" role="alert"></span>
        <div class="dialog-actions">
          <button class="button secondary" value="cancel">Cancel</button>
          <button id="ticket-continue" class="button primary" value="default">Continue</button>
        </div>
      </form>
    </dialog>

    <dialog id="offer-dialog" class="dialog">
      <form method="dialog">
        <h2>Incoming file</h2>
        <p id="offer-sender"></p>
        <div class="file-row">
          <span class="file-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z" /><path d="M14 2v5h5" /></svg>
          </span>
          <span><strong id="offer-name"></strong><small id="offer-size"></small></span>
        </div>
        <span id="offer-error" class="error" role="alert"></span>
        <div class="dialog-actions">
          <button id="decline-offer" class="button secondary" value="cancel">Decline</button>
          <button id="accept-offer" class="button primary" value="default">Accept</button>
        </div>
      </form>
    </dialog>

    <div id="drop-overlay" class="drop-overlay" hidden>Drop to send</div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
